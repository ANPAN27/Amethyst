name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion/package-lock.json
      - run: npm ci
      - run: npm --prefix companion ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run companion:typecheck
      - run: npm run companion:build
      - run: npm run build
